spring.application.name=workshop

# Database Configuration with Environment Variables
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/motosnap}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:60000}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.use_sql_comments=${USE_SQL_COMMENTS:false}
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.hbm2ddl.foreign_key_strategy=ignore

# Database SSL Configuration
spring.datasource.hikari.data-source-properties.useSSL=${DB_SSL:false}
spring.datasource.hikari.data-source-properties.requireSSL=${DB_REQUIRE_SSL:false}
spring.datasource.hikari.data-source-properties.serverTimezone=UTC

# API Base Path
spring.data.rest.base-path=/api

# JWT Configuration
jwt.secret=${JWT_SECRET:fallback-secret-for-dev-only-must-be-at-least-32-chars}
jwt.expiration.access=${JWT_ACCESS_EXPIRATION:900000}
jwt.expiration.refresh=${JWT_REFRESH_EXPIRATION:604800000}

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict

# Logging Configuration
logging.level.com.motosnap.workshop=OFF
logging.level.org.springframework.security=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Server Configuration
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration
file.upload-dir=${UPLOAD_DIR:./uploads}
app.upload.dir=${file.upload-dir}
app.upload.max-file-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/**

# MIME Type Mappings for JavaScript files
spring.web.resources.chain.strategy.content.enabled=false

# Simple CORS Configuration
spring.cors.enabled=true
spring.cors.allowed-origins=*
spring.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cors.allowed-headers=*

# Email Configuration - Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vssmoto123@gmail.com
spring.mail.password=qmow jlce jknv fkkd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Email Template Configuration
spring.mail.templates.path=classpath:/templates/
spring.mail.default-encoding=UTF-8

# Force Render Rebuild - 2025-09-23-14-45-EMERGENCY
emergency.rebuild.timestamp=2025-09-23-14-45-EMERGENCY
